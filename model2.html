<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 3 - PBR Shader</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
    <!-- นำเข้า Import Maps เพื่อเรียกใช้ Three.js และ addons ได้ง่ายขึ้น -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">Assignment #3: Next Gen Rendering (PBR Shader)</div>

    <script type="module">
      import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { GUI } from 'three/addons/libs/lil-gui.module.min.js';


      // SCENE, CAMERA, RENDERER SETUP
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 3, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      //LIGHTING
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      // Point Light (แสงหลักที่จะให้ GUI ปรับตำแหน่ง)
      const light = new THREE.PointLight(0xffffff, 50, 100);
      light.position.set(3, 5, 3);
      light.castShadow = true;
      scene.add(light);

      // ตัวแสดงตำแหน่งของแสง (Visual Helper)
      const lightHelper = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
      );
      light.add(lightHelper);

      // PBR MATERIALS & OBJECT

      const characterMaterial = new THREE.MeshStandardMaterial({
        color: 0x0077ff,
        metalness: 0.8,
        roughness: 0.2,
      });

      let mainCharacter = new THREE.Mesh(
        new THREE.SphereGeometry(1, 32, 32),
        characterMaterial
      );
      mainCharacter.position.set(0, 1, 0);
      mainCharacter.castShadow = true;
      scene.add(mainCharacter);

      const exrSkyboxUrl = 'https://raw.githubusercontent.com/pornnatchaMind/pornnatchaMind.github.io/main/model%20work2/cowboy_town_saloon_1k.exr';

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      new EXRLoader()
        .setDataType(THREE.HalfFloatType) 
        .load(exrSkyboxUrl, (texture) => {
            const skybox = pmremGenerator.fromEquirectangular(texture).texture;
            scene.background = skybox;
            scene.environment = skybox;

            texture.dispose();
            pmremGenerator.dispose();
        }, undefined, (error) => {
            console.error('Unable to load EXR skybox:', error);
        });

    
      //MODELS

      const loader = new GLTFLoader();

      const mainCharacterUrl = 'https://raw.githubusercontent.com/pornnatchaMind/pornnatchaMind.github.io/main/model%20work2/model__4.glb';

      loader.load(mainCharacterUrl, (gltf) => {
        scene.remove(mainCharacter); // ลบวงกลมชั่วคราวออก

        mainCharacter = gltf.scene;
        mainCharacter.position.set(0, 0, 0);
        mainCharacter.scale.set(0.1, 0.1, 0.1); 

        mainCharacter.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        scene.add(mainCharacter);
      }, undefined, (error) => {
        console.error('เกิดข้อผิดพลาดในการโหลดโมเดล 1:', error);
      });

      //Car Model
      const carUrl = 'https://raw.githubusercontent.com/pornnatchaMind/pornnatchaMind.github.io/main/model%20work2/car2.glb';

      loader.load(carUrl, (gltf) => {
        const carModel = gltf.scene;
        
        carModel.position.set(-5, 0, -3);
        carModel.scale.set(2.0, 2.0, 1.5); 

        carModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        scene.add(carModel);
      }, undefined, (error) => {
        console.error('เกิดข้อผิดพลาดในการโหลดโมเดลรถ:', error);
      });
      
      //Bear Model
      const bearUrl = 'https://raw.githubusercontent.com/pornnatchaMind/pornnatchaMind.github.io/main/model%20work2/bear3.glb';

      loader.load(bearUrl, (gltf) => {
        const bearModel = gltf.scene;
        
        bearModel.position.set(3, 0.6, 3);
        bearModel.scale.set(0.5, 0.5, 0.5); 

        bearModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        scene.add(bearModel);
      }, undefined, (error) => {
        console.error('เกิดข้อผิดพลาดในการโหลดโมเดลหมี:', error);
      });

      //Spaceship Model
      const spaceUrl = 'https://raw.githubusercontent.com/pornnatchaMind/pornnatchaMind.github.io/main/model%20work2/space2.glb';

      loader.load(spaceUrl, (gltf) => {
        const spaceshipModel = gltf.scene;
        
        spaceshipModel.position.set(3, 1, -3);
        spaceshipModel.scale.set(0.01, 0.01, 0.01); 

        spaceshipModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        scene.add(spaceshipModel);
      }, undefined, (error) => {
        console.error('เกิดข้อผิดพลาดในการโหลดโมเดลspaceshipModel:', error);
      });

      //พื้น

      const textureUrl = 'https://raw.githubusercontent.com/pornnatchaMind/pornnatchaMind.github.io/main/model%20work2/Timber-Flooring-Teak.jpg';

      const texFloor = new THREE.TextureLoader().load(textureUrl, (texture) => {
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(4, 4); 
      });

      const matFloor = new THREE.MeshStandardMaterial({
        map: texFloor,
        side: THREE.DoubleSide,
        roughness: 0.4,
        metalness: 0.1
      });

      const planeGeometry = new THREE.PlaneGeometry(15, 15);
      const plane = new THREE.Mesh(planeGeometry, matFloor);
      plane.rotation.x = -Math.PI / 2; 
      plane.receiveShadow = true;

      scene.add(plane);

      //GUI FOR INTERACTION
      const gui = new GUI({ title: 'PBR & Light Control' });

      const lightFolder = gui.addFolder('Light Position');
      lightFolder.add(light.position, 'x', -10, 10, 0.1);
      lightFolder.add(light.position, 'y', 0, 15, 0.1);
      lightFolder.add(light.position, 'z', -10, 10, 0.1);
      lightFolder.add(light, 'intensity', 0, 200, 1).name('Light Intensity');

      //RENDER LOOP & RESIZE EVENT

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
