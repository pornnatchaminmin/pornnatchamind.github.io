<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Final Assignment  - present project</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      background: rgba(0, 0, 0, .7);
      padding: 8px 12px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 99;
      font-size: 24px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>

  <div id="info">Final Assignment</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    // SCENE
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x333333);

    // CAMERA
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 2000);
    camera.position.set(0, 5, 10);

    // RENDERER
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ORBIT CONTROLS
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.enableDamping = true;

    // MAIN GROUP
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    // PICKING
    const pickables = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    let targetFocusPosition = null;
    let targetCameraPosition = null;
    let selectedObject = null;
    let isPickingZoom = false;

    function getPickRoot(object) {
      let current = object;
      while (current.parent && current.parent !== mainGroup) {
        current = current.parent;
      }
      return current;
    }

    renderer.domElement.addEventListener('click', onPick);

    function onPick(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      pointer.x = (x / rect.width) * 2 - 1;
      pointer.y = -(y / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(pickables, true);

      if (isPickingZoom) {
        if (intersects.length > 0) {
          const clickedRoot = getPickRoot(intersects[0].object);
          if (clickedRoot !== selectedObject) {
            selectedObject = null;
            isPickingZoom = false;
            targetCameraPosition = null;
            targetFocusPosition = null;
            controls.enabled = true;
            return;
          }
          return;
        }
        selectedObject = null;
        isPickingZoom = false;
        targetCameraPosition = null;
        targetFocusPosition = null;
        controls.enabled = true;
        return;
      }

      if (intersects.length > 0) {
        const clickedRoot = getPickRoot(intersects[0].object);
        selectedObject = clickedRoot;

        const box = new THREE.Box3().setFromObject(clickedRoot);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);

        targetFocusPosition = center.clone();
        const zoomDistance = Math.max(maxSize * 2.5, 2.0);
        const direction = camera.position.clone().sub(center).normalize();

        targetCameraPosition = center.clone().add(direction.multiplyScalar(zoomDistance));
        isPickingZoom = true;
        controls.enabled = true;
      }
    }

    // ==========================================
    // CEL SHADING & OUTLINE SETTINGS (ปรับตามภาพ)
    // ==========================================
    const celSettings = {
      levels: 4,
      ambient: 0.45,
      intensity: 0.05,
      outlineThickness: 0.05,
      outlineColor: '#000000'
    };

    const celMaterials = [];
    const outlineMaterials = [];

    // CEL SHADING
    function applyCelShading(material) {
      if (!material) return;
      if (!material.isMeshStandardMaterial && !material.isMeshPhysicalMaterial) return;

      material.onBeforeCompile = function (shader) {
        shader.uniforms.uCelLevels = { value: celSettings.levels };
        shader.uniforms.uCelIntensity = { value: celSettings.intensity };
        shader.uniforms.uCelAmbient = { value: celSettings.ambient };

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <output_fragment>',
          `
          float celBrightness = dot(outgoingLight, vec3(0.299, 0.587, 0.114));
          celBrightness = clamp(celBrightness, 0.0, 1.0);

          float celLevel = floor(celBrightness * uCelLevels) / uCelLevels;
          celLevel = max(celLevel, uCelAmbient);

          vec3 celColor = outgoingLight * (
            mix(1.0, celLevel / max(celBrightness, 0.001), uCelIntensity)
          );

          outgoingLight = celColor;

          #include <output_fragment>
          `
        );
        material.userData.celShader = shader;
      };

      material.needsUpdate = true;
      celMaterials.push(material);
    }

    // OUTLINE SHADER (Inverted Hull)
    const outlineVertexShader = `
      uniform float uOutlineThickness;

      void main() {
        vec3 pos = position;
        pos += normal * uOutlineThickness;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `;

    const outlineFragmentShader = `
      uniform vec3 uOutlineColor;

      void main() {
        gl_FragColor = vec4(uOutlineColor, 1.0);
      }
    `;

    function createOutlineMaterial() {
      const mat = new THREE.ShaderMaterial({
        vertexShader: outlineVertexShader,
        fragmentShader: outlineFragmentShader,
        uniforms: {
          uOutlineThickness: { value: celSettings.outlineThickness },
          uOutlineColor: { value: new THREE.Color(celSettings.outlineColor) }
        },
        side: THREE.BackSide,
        depthWrite: false
      });
      outlineMaterials.push(mat);
      return mat;
    }

    // ATTACH OUTLINE
    function attachOutline(mesh) {
      if (!mesh.isMesh || mesh.userData.isOutline) return;

      const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      const isTransparent = materials.some(m => 
        m.transparent === true || 
        m.opacity < 0.95 || 
        m.transmission > 0 || 
        (mesh.name && mesh.name.toLowerCase().includes('glass'))
      );

      if (isTransparent) return;

      const outlineMesh = new THREE.Mesh(mesh.geometry, createOutlineMaterial());
      outlineMesh.userData.isOutline = true;
      mesh.add(outlineMesh);
    }

    // APPLY CEL & OUTLINE TO MODEL
    function applyCelToModel(model, withOutline = true) {
      if (!model) return;

      const meshes = [];
      model.traverse(function (child) {
        if (!child.isMesh || child.userData.isOutline) return;

        child.castShadow = true;
        child.receiveShadow = true;

        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach(function (material) {
          applyCelShading(material);
        });

        meshes.push(child);
      });

      if (withOutline) {
        meshes.forEach(mesh => attachOutline(mesh));
      }
    }

    // LIGHTS
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 80, 50);
    pointLight.position.set(0, 3, 0);
    pointLight.castShadow = true;
    scene.add(pointLight);

    // GLTF LOADER
    const loader = new GLTFLoader();
    const BASE_URL = 'https://pornnatchamind.github.io/project/model_project/';

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    let door1 = null, door1StartX = 0;
    let fish1 = null, fish1StartX = 0;
    let fish3 = null, fish3StartX = 0;
    let fish4 = null, fish4StartX = 0;
    let book = null, bookStartX = 0;
    let homeModel = null;
    let water = null;
    let waterShaderUniforms = [];
    let waterOutlineUniforms = [];

    // LOAD ROOM
    loader.load(BASE_URL + 'moldel3.glb', function (gltf) {
      const room = gltf.scene;
      applyCelToModel(room, true);
      mainGroup.add(room);

      const box = new THREE.Box3().setFromObject(room);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      controls.target.copy(center);

      const maxSize = Math.max(size.x, size.y, size.z);
      camera.position.set(center.x + maxSize * 1.2, center.y + maxSize * 0.7, center.z + maxSize * 1.2);
      camera.lookAt(center);
      controls.update();
    });

    // LOAD TEXT
    loader.load(BASE_URL + 'Taxt2.glb', function (gltf) {
      const textModel = gltf.scene;
      applyCelToModel(textModel, true);
      mainGroup.add(textModel);
    });

    // LOAD TEXT3
    loader.load(BASE_URL + 'text3.glb', function (gltf) {
      const text3Model = gltf.scene;
      text3Model.name = 'text3';
      applyCelToModel(text3Model, true);
      mainGroup.add(text3Model);
    });

    // LOAD IMAGE MODELS
    const imageFiles = [
      { name: 'image1', file: 'image1.glb' },
      { name: 'image2', file: 'image2.glb' },
      { name: 'image3', file: 'image3.glb' },
      { name: 'image4', file: 'image4glb.glb' },
      { name: 'image5', file: 'image5glb.glb' },
      { name: 'image6', file: 'image6.glb' },
      { name: 'P', file: 'P.glb' },
      { name: 'text', file: 'text.glb' }
    ];

    imageFiles.forEach(function (item) {
      loader.load(BASE_URL + item.file, function (gltf) {
        const imgModel = gltf.scene;
        imgModel.name = item.name;
        applyCelToModel(imgModel, true);

        imgModel.traverse(function (child) {
          if (child.isMesh && !child.userData.isOutline) {
            child.name = item.name;
            pickables.push(child);
          }
        });
        mainGroup.add(imgModel);
      });
    });

    // LOAD DOOR
    loader.load(BASE_URL + 'door1.glb', function (gltf) {
      door1 = gltf.scene;
      door1StartX = door1.position.x;
      applyCelToModel(door1, true);
      mainGroup.add(door1);
    });

    // LOAD WATER
    loader.load(BASE_URL + 'water.glb', function (gltf) {
      water = gltf.scene;
      const waterMeshes = [];

      water.traverse(function (child) {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
        pickables.push(child);
        waterMeshes.push(child);

        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach(function (material) {
          if (!material) return;
          if (material.isMeshStandardMaterial || material.isMeshPhysicalMaterial) {
            material.onBeforeCompile = function (shader) {
              shader.uniforms.uCelLevels = { value: celSettings.levels };
              shader.uniforms.uCelIntensity = { value: celSettings.intensity };
              shader.uniforms.uCelAmbient = { value: celSettings.ambient };
              shader.uniforms.uTime = { value: 0 };
              waterShaderUniforms.push(shader.uniforms.uTime);

              shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader;
              shader.vertexShader = shader.vertexShader.replace(
                '#include <begin_vertex>',
                `
                #include <begin_vertex>
                float wave1 = sin(transformed.x * 4.0 + uTime * 2.0);
                float wave2 = cos(transformed.z * 5.0 + uTime * 1.5);
                float wave = (wave1 + wave2) * 0.08;
                transformed.y += wave;
                `
              );

              shader.fragmentShader = shader.fragmentShader.replace(
                '#include <output_fragment>',
                `
                float celBrightness = dot(outgoingLight, vec3(0.299, 0.587, 0.114));
                celBrightness = clamp(celBrightness, 0.0, 1.0);
                float celLevel = floor(celBrightness * uCelLevels) / uCelLevels;
                celLevel = max(celLevel, uCelAmbient);
                vec3 celColor = outgoingLight * (
                  mix(1.0, celLevel / max(celBrightness, 0.001), uCelIntensity)
                );
                outgoingLight = celColor;
                #include <output_fragment>
                `
              );
              material.userData.celShader = shader;
            };
            material.needsUpdate = true;
            celMaterials.push(material);
          }
        });
      });

      waterMeshes.forEach(mesh => {
        const waterOutlineMat = new THREE.ShaderMaterial({
          vertexShader: `
            uniform float uOutlineThickness;
            uniform float uTime;
            void main() {
              vec3 pos = position;
              float wave1 = sin(pos.x * 4.0 + uTime * 2.0);
              float wave2 = cos(pos.z * 5.0 + uTime * 1.5);
              pos.y += (wave1 + wave2) * 0.08;
              pos += normal * uOutlineThickness;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
          `,
          fragmentShader: outlineFragmentShader,
          uniforms: {
            uOutlineThickness: { value: celSettings.outlineThickness },
            uOutlineColor: { value: new THREE.Color(celSettings.outlineColor) },
            uTime: { value: 0 }
          },
          side: THREE.BackSide,
          depthWrite: false
        });

        outlineMaterials.push(waterOutlineMat);
        waterOutlineUniforms.push(waterOutlineMat.uniforms.uTime);

        const outlineMesh = new THREE.Mesh(mesh.geometry, waterOutlineMat);
        outlineMesh.userData.isOutline = true;
        mesh.add(outlineMesh);
      });

      mainGroup.add(water);
    });

    // LOAD FISH 1, 3, 4
    loader.load(BASE_URL + 'fish1.glb', function (gltf) {
      fish1 = gltf.scene;
      fish1StartX = fish1.position.x;
      applyCelToModel(fish1, true);
      mainGroup.add(fish1);
    });

    loader.load(BASE_URL + 'fish3.glb', function (gltf) {
      fish3 = gltf.scene;
      fish3StartX = fish3.position.x;
      applyCelToModel(fish3, true);
      mainGroup.add(fish3);
    });

    loader.load(BASE_URL + 'fish4.glb', function (gltf) {
      fish4 = gltf.scene;
      fish4StartX = fish4.position.x;
      applyCelToModel(fish4, true);
      mainGroup.add(fish4);
    });

    // LOAD HOME
    loader.load(BASE_URL + 'Home.glb', function (gltf) {
      homeModel = gltf.scene;
      homeModel.name = 'Home';
      applyCelToModel(homeModel, true);
      homeModel.traverse(function (child) {
        if (child.isMesh && !child.userData.isOutline) pickables.push(child);
      });
      mainGroup.add(homeModel);
    });

    // LOAD BOOK
    loader.load(BASE_URL + 'book.glb', function (gltf) {
      book = gltf.scene;
      bookStartX = book.position.x;
      applyCelToModel(book, true);
      mainGroup.add(book);
    });

    // EXR SKYBOX
    const exrSkyboxUrl = 'https://raw.githubusercontent.com/pornnatchaMind/pornnatchaMind.github.io/main/model%20work2/cowboy_town_saloon_1k.exr';
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    new EXRLoader().setDataType(THREE.HalfFloatType).load(
      exrSkyboxUrl,
      function (texture) {
        const skybox = pmremGenerator.fromEquirectangular(texture).texture;
        scene.background = skybox;
        scene.environment = skybox;
        texture.dispose();
        pmremGenerator.dispose();
      },
      undefined,
      function () {
        scene.background = new THREE.Color(0x333333);
      }
    );

    // GUI
    const gui = new GUI({ title: 'Control' });

    // CEL SHADING GUI
    const celFolder = gui.addFolder('Cel Shading');
    celFolder.add(celSettings, 'levels', 2, 8, 1).name('Light Levels');
    celFolder.add(celSettings, 'intensity', 0, 1, 0.05).name('Cel Intensity');
    celFolder.add(celSettings, 'ambient', 0, 0.8, 0.05).name('Cel Ambient');
    celFolder.open();

    // OUTLINE GUI
    const outlineFolder = gui.addFolder('Outline');
    outlineFolder.add(celSettings, 'outlineThickness', 0.001, 0.08, 0.002).name('Thickness').onChange(val => {
      outlineMaterials.forEach(mat => mat.uniforms.uOutlineThickness.value = val);
    });
    outlineFolder.addColor(celSettings, 'outlineColor').name('Color').onChange(val => {
      outlineMaterials.forEach(mat => mat.uniforms.uOutlineColor.value.set(val));
    });
    outlineFolder.open();

    // AMBIENT LIGHT GUI
    const ambientFolder = gui.addFolder('Ambient Light');
    ambientFolder.add(ambientLight, 'intensity', 0, 5, 0.1).name('Intensity');
    ambientFolder.open();

    // ANIMATION LOOP
    function animate(time) {
      requestAnimationFrame(animate);

      // UPDATE CEL SHADING UNIFORMS
      celMaterials.forEach(function (material) {
        if (material?.userData?.celShader) {
          const shader = material.userData.celShader;
          if (shader.uniforms.uCelLevels) shader.uniforms.uCelLevels.value = celSettings.levels;
          if (shader.uniforms.uCelIntensity) shader.uniforms.uCelIntensity.value = celSettings.intensity;
          if (shader.uniforms.uCelAmbient) shader.uniforms.uCelAmbient.value = celSettings.ambient;
        }
      });

      // DOOR ANIMATION
      if (door1) {
        const doorT = Math.sin(time * 0.001) * 0.5 + 0.5;
        door1.position.x = lerp(door1StartX, door1StartX + 5.0, doorT);
      }

      // FISH ANIMATIONS
      if (fish1) {
        const fish1T = Math.sin(time * 0.0015) * 0.5 + 0.5;
        fish1.position.x = lerp(fish1StartX - 0.4, fish1StartX + 0.6, fish1T);
      }
      if (fish3) {
        const fish3T = Math.sin(time * 0.001) * 0.5 + 0.5;
        fish3.position.x = lerp(fish3StartX - 1.5, fish3StartX + 0.5, fish3T);
      }
      if (fish4) {
        const fish4T = Math.sin(time * 0.001) * 0.5 + 0.5;
        fish4.position.x = lerp(fish4StartX - 1.0, fish4StartX + 0.8, fish4T);
      }

      // BOOK ANIMATION
      if (book) {
        const bookT = Math.sin(time * 0.002) * 0.5 + 0.5;
        book.position.x = lerp(bookStartX - 0.2, bookStartX + 4.0, bookT);
      }

      // PICKING CAMERA ZOOM LERP
      if (targetFocusPosition) {
        controls.target.lerp(targetFocusPosition, 0.08);
        if (targetCameraPosition) {
          camera.position.lerp(targetCameraPosition, 0.08);
        }
      }

      // WATER VERTEX SHADER & OUTLINE TIME
      const t = time * 0.001;
      waterShaderUniforms.forEach(uniform => uniform.value = t);
      waterOutlineUniforms.forEach(uniform => uniform.value = t);

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // RESIZE
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
